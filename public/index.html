

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RhinoMDs Billing Services | Medical VA Department Portal</title>
<style>
:root{--bg:#eef2f6;--surface:#fff;--surface2:#f8fafc;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--accent2:#0d9488;--purple:#884EA0;--red:#c24141;--amber:#b7791f;--shadow:0 8px 24px rgba(15,23,42,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.48 "Inter","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:10px 15px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-weight:650;transition:.15s}
button:hover{filter:brightness(1.06)}button.secondary{background:#e2e8f0;color:#1e293b}button.danger{background:#fff0f0;color:var(--red)}button.small{padding:6px 11px;font-size:12px;border-radius:8px}

.rhino-logo-pill{display:inline-flex;align-items:center;background:#f8f9ff;padding:7px 14px;border-radius:14px;border:1px solid rgba(136,78,160,.2);box-shadow:0 6px 18px rgba(15,23,42,.2)}
.rhino-logo-pill img,.rhino-logo-pill svg{height:44px;width:auto;display:block}

/* ANIMATED PROJECTION INTRO */
.intro-overlay{position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 35%,#1e3a8a 0%,#0f172a 55%,#060b16 100%);display:grid;place-items:center;padding:24px;color:#fff;text-align:center;transition:opacity .65s ease,transform .65s ease,visibility .65s ease;overflow:hidden}
.intro-overlay.hide{opacity:0;transform:scale(1.04);visibility:hidden;pointer-events:none}
.projector-glow{position:absolute;width:680px;height:680px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.22) 0%,rgba(37,99,235,.14) 40%,transparent 70%);filter:blur(24px);animation:pulseGlow 2.6s ease-in-out infinite alternate;pointer-events:none}
.projector-beam{position:absolute;top:-25%;left:50%;transform:translateX(-50%);width:140%;height:75%;background:conic-gradient(from 165deg at 50% 0%,transparent 0deg,rgba(94,234,212,.1) 15deg,rgba(59,130,246,.12) 25deg,transparent 40deg);pointer-events:none}
.intro-stage{position:relative;z-index:2;max-width:720px;width:100%}
.intro-logo{position:relative;overflow:hidden;display:inline-flex;align-items:center;background:#f8f9ff;padding:12px 22px;border-radius:18px;box-shadow:0 0 40px rgba(45,212,191,.28),0 18px 40px rgba(0,0,0,.45);opacity:0;transform:translateY(18px) scale(.92);animation:fadeUpScale .75s cubic-bezier(.22,1,.36,1) .1s forwards}
.intro-logo::after{content:"";position:absolute;top:0;left:-120%;width:70%;height:100%;background:linear-gradient(110deg,transparent,rgba(255,255,255,.85),transparent);animation:lightSweep 1.1s ease .45s forwards}
.intro-logo img,.intro-logo svg{height:60px;width:auto;display:block}
.intro-company{margin:24px 0 6px;font-size:clamp(28px,4.5vw,44px);font-weight:850;letter-spacing:3px;opacity:0;filter:blur(6px);transform:translateY(14px);background:linear-gradient(90deg,#fff 0%,#e0e7ff 50%,#99f6e4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation:projectText .8s cubic-bezier(.22,1,.36,1) .45s forwards}
.intro-tagline{margin:0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:16px;color:#c4b5fd;opacity:0;animation:fadeOnly .7s ease .8s forwards}
.intro-divider{height:2px;width:0;margin:20px auto;background:linear-gradient(90deg,transparent,#2dd4bf,#60a5fa,transparent);box-shadow:0 0 16px rgba(45,212,191,.8);animation:expandLine .7s ease .95s forwards}
.intro-dept{display:inline-block;padding:8px 20px;border-radius:99px;background:rgba(255,255,255,.08);border:1px solid rgba(45,212,191,.35);color:#99f6e4;font-size:clamp(13px,2vw,16px);font-weight:700;letter-spacing:1.8px;text-transform:uppercase;opacity:0;transform:translateY(10px);animation:fadeUp .65s ease 1.15s forwards}
.intro-loader{width:180px;height:3px;margin:26px auto 0;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;opacity:0;animation:fadeOnly .4s ease 1.2s forwards}
.intro-loader i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#14b8a6);animation:loadBar 1.3s ease 1.2s forwards}
.skip-btn{position:absolute;top:24px;right:24px;z-index:3;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#e2e8f0;padding:7px 14px;border-radius:99px;font-size:12px;font-weight:600}
@keyframes pulseGlow{from{transform:scale(.95);opacity:.7}to{transform:scale(1.08);opacity:1}}
@keyframes fadeUpScale{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes lightSweep{to{left:150%}}
@keyframes projectText{to{opacity:1;filter:blur(0);transform:translateY(0);letter-spacing:-.4px}}
@keyframes fadeOnly{to{opacity:1}}
@keyframes expandLine{to{width:260px}}
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}
@keyframes loadBar{to{width:100%}}

/* LOGIN PAGE + ROLE SWITCHER */
.login-page{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr}
.hero-panel{position:relative;overflow:hidden;background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 58%,#0d9488 100%);color:#fff;padding:48px 52px;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow-pill{display:inline-flex;margin-top:34px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#99f6e4}
.hero-title{margin:16px 0 12px;font-size:34px;line-height:1.15;font-weight:800}
.bento-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:26px}
.glass-card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:16px}
.glass-card small{color:#99f6e4;font-weight:700;font-size:11px;text-transform:uppercase;display:block}
.glass-card strong{display:block;margin-top:6px;font-size:15px}
.glass-card span{font-size:12px;color:#cbd5e1}
.form-panel{display:grid;place-items:center;padding:36px 24px}
.login-card{width:100%;max-width:440px;background:#fff;border-radius:20px;border:1px solid var(--line);border-top:4px solid var(--accent);box-shadow:0 20px 50px rgba(15,23,42,.09);padding:34px 32px}
.role-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f1f5f9;padding:5px;border-radius:12px;margin-bottom:18px}
.role-tabs button{background:transparent;color:#475569;padding:9px 8px;border-radius:9px;font-size:12px;font-weight:700}
.role-tabs button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.22)}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap input{width:100%;padding:11px 14px;border:1px solid #cbd5e1;border-radius:10px;background:#f8fafc}
.toggle-pw{position:absolute;right:8px;background:transparent;color:var(--muted);padding:4px 8px;font-size:12px}

/* STYLE #3 TOP-NAV SHELL */
.bento-header{background:linear-gradient(135deg,#0f172a 0%,#1e3a8a 58%,#0d9488 100%);color:#fff;padding:18px 28px 22px;box-shadow:0 10px 30px rgba(15,23,42,.15)}
.bento-top{max-width:1480px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.user-chip{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);padding:7px 13px;border-radius:99px;font-size:12px;color:#fff}
.bell-btn{position:relative;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);color:#fff;padding:8px 13px;border-radius:99px;font-size:13px}
.bell-badge{position:absolute;top:-5px;right:-4px;background:#ef4444;color:#fff;font-size:10px;font-weight:800;min-width:18px;height:18px;border-radius:99px;display:grid;place-items:center;padding:0 5px}
.bento-nav{max-width:1480px;margin:16px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.bento-nav button{background:rgba(255,255,255,.11);color:#e2e8f0;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600}
.bento-nav button:hover{background:rgba(255,255,255,.2);color:#fff}
.bento-nav button.active{background:#fff;color:#0f172a;box-shadow:0 6px 16px rgba(0,0,0,.15)}

main{padding:26px 28px;max-width:1480px;width:100%;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.eyebrow{font-size:11px;color:var(--accent);font-weight:800;letter-spacing:1.3px;text-transform:uppercase}
.page-title{font-size:25px;margin:3px 0 0;color:var(--ink);letter-spacing:-.4px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.date-pill{background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600}

/* Birthday Banner */
.bday-banner{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border-radius:16px;padding:16px 20px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 12px 26px rgba(124,58,237,.22)}
.bday-banner strong{font-size:16px;display:block}

.grid{display:grid;gap:16px}.kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);min-width:0}
.kpi-card{border-top:3px solid var(--accent)}
.kpi-label{color:var(--muted);font-size:12px;font-weight:650}.kpi-value{font-size:29px;font-weight:800;color:var(--ink);margin:8px 0 3px;letter-spacing:-.5px}.kpi-note{font-size:11px;color:var(--muted)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}.section-head h3{margin:0;color:var(--ink);font-size:15px}.muted{color:var(--muted)}
.two{grid-template-columns:1.35fr 1fr}.three{grid-template-columns:repeat(3,minmax(0,1fr))}
table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;background:#f1f5f9;color:#475569;font-size:10px;letter-spacing:.6px;text-transform:uppercase;padding:11px 10px;white-space:nowrap}td{padding:11px 10px;border-top:1px solid var(--line);vertical-align:middle}tr:hover td{background:#f8fafc}
.table-wrap{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:12px}.table-wrap table{min-width:680px}
.tag{display:inline-flex;border-radius:99px;padding:4px 9px;background:#edf6f5;color:#087e70;font-size:10px;font-weight:750}.tag.gray{background:#eef1f4;color:#647789}.tag.warn{background:#fff5df;color:#9b650e}.tag.red{background:#fff0f0;color:#b33e3e}.tag.blue{background:#e8f2ff;color:#1b5bb5}.tag.purple{background:#f3e8ff;color:#7e22ce}
.bar-list{display:grid;gap:13px}.bar-row{display:grid;grid-template-columns:130px 1fr 52px;align-items:center;gap:10px;font-size:12px}.bar-track{height:9px;border-radius:9px;background:#edf2f6;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:9px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:700;color:#475569}.field input,.field select,.field textarea,input.control,select.control{border:1px solid #cbd5e1;background:#f8fafc;border-radius:9px;padding:9px 11px;color:var(--ink);min-width:0}
.field textarea{min-height:65px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:none;background:#fff;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.form-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.form-grid .wide{grid-column:span 2}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:14px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.calendar div{padding:9px 4px;text-align:center;font-size:11px;border-radius:8px}.calendar .dow{color:var(--muted);font-weight:800}.calendar .day{background:#f1f5f9;cursor:pointer}.calendar .day:hover{background:#dbeafe}.calendar .selected{background:var(--accent);color:#fff}.calendar .today{outline:1px solid var(--accent)}.calendar .has-data:after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:#e49b35;margin:3px auto 0}
.score{font-size:18px;font-weight:800;color:var(--ink)}.rank{font-size:17px;font-weight:850;color:var(--ink)}.notice{background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px;padding:12px;color:#1e40af;font-size:12px;margin-bottom:14px}
.toast{position:fixed;right:22px;bottom:22px;background:#0f172a;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:80}.toast.show{opacity:1;transform:translateY(0)}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;place-items:center;padding:20px;z-index:60}.modal-bg.open{display:grid}.modal{background:#fff;border-radius:16px;padding:24px;width:100%;max-width:620px;max-height:88vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.notif-item{padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fff}
.notif-item.unread{background:#eff6ff;border-color:#93c5fd}
@media(max-width:960px){.login-page,.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}.bento-grid{grid-template-columns:1fr}}
@media(max-width:650px){.kpis{grid-template-columns:1fr}.three,.form-grid{grid-template-columns:repeat(2,1fr)}.form-grid .wide{grid-column:span 2}main{padding:18px}.bento-header{padding:16px}}
</style></head>
<body>
<div id="root"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>
<script>
const LOGO_HTML = `<div class="rhino-logo-pill">
  <img src="/logo.png" alt="RhinoMDs Billing Services" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
  <svg style="display:none" viewBox="0 0 305 84" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M27 31C26 19 28 11 33 10C36 16 37 23 37 29" stroke="#884EA0" stroke-width="2.1" stroke-linecap="round"/>
    <path d="M23 22C18 30 18 41 23 50" stroke="#884EA0" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M37 29C43 29 47 24 49 18C50 24 52 30 55 31C61 29 66 20 69 14C70 25 66 38 59 46C54 52 46 55 39 55" stroke="#884EA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M16 63C24 70 35 70 45 64" stroke="#884EA0" stroke-width="2" stroke-linecap="round"/>
    <circle cx="43" cy="38" r="1.4" fill="#884EA0"/>
    <text x="80" y="33" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#7c8594">RhinoMDs</text>
    <text x="80" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#7c8594">Billing Services</text>
    <text x="80" y="75" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.2" fill="#884EA0">Your Strength In Practice Management</text>
  </svg>
</div>`;

let state = null;
let currentPage = "dashboard";
let introPlayed = false;
let loginRole = "user";
const todayISO = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
let selectedDate = todayISO(), monthSelected = todayISO(), reviewFilters = {from:"",to:"",lead:"",user:"",q:"",status:"All"};

const pages = {
  dashboard: "Operations Command Dashboard",
  master: "Accounts, Credentials & Assignments",
  signoff: "Daily Sign-Off",
  review: "Review & Export Reports",
  tasks: "Tasks & Assignments",
  bonus: "Monthly Bonus Scorecard",
  leaderboard: "Row Lead Leaderboard",
  settings: "Settings & Backup"
};

function toast(s){ const t=document.getElementById("toast"); t.textContent=s; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2800); }
function esc(s){ return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function num(v){ return Number(v)||0; }
function money(v){ return "$"+num(v).toLocaleString(undefined,{maximumFractionDigits:2}); }
function monthBounds(value){ const [y,m]=value.slice(0,7).split("-").map(Number), last=new Date(y,m,0).getDate(); return [`${y}-${String(m).padStart(2,"0")}-01`,`${y}-${String(m).padStart(2,"0")}-${String(last).padStart(2,"0")}`]; }
function inMonth(date,month){ const [a,b]=monthBounds(month); return date>=a && date<=b; }
function workdays(a,b){ let d=new Date(a+"T12:00:00"), end=new Date(b+"T12:00:00"), n=0; while(d<=end){ if(d.getDay()!==0&&d.getDay()!==6) n++; d.setDate(d.getDate()+1); } return n; }

async function api(url, opts={}) {
  const res = await fetch(url, { headers: { "Content-Type": "application/json", ...(opts.headers||{}) }, ...opts });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function closeModal(){ document.getElementById("modalBg").classList.remove("open"); }
function openModal(html){ document.getElementById("modalBox").innerHTML = html; document.getElementById("modalBg").classList.add("open"); }
document.getElementById("modalBg").onclick = (e) => { if(e.target.id === "modalBg") closeModal(); };

async function boot() {
  try {
    state = await api("/api/bootstrap");
    introPlayed = true;
    renderAppShell();
    setPage(currentPage);
  } catch {
    renderLogin("", !introPlayed);
  }
}

function renderLogin(errMsg="", withIntro=false) {
  const showIntro = withIntro && !introPlayed;
  introPlayed = true;

  document.getElementById("root").innerHTML = `
  ${showIntro ? `
  <div class="intro-overlay" id="intro">
    <div class="projector-beam"></div><div class="projector-glow"></div>
    <button class="skip-btn" id="skipBtn">Skip →</button>
    <div class="intro-stage">
      <div class="intro-logo">
        <img src="/logo.png" alt="RhinoMDs Billing Services" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
        <svg style="display:none" viewBox="0 0 305 84" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M27 31C26 19 28 11 33 10C36 16 37 23 37 29" stroke="#884EA0" stroke-width="2.1" stroke-linecap="round"/>
          <path d="M23 22C18 30 18 41 23 50" stroke="#884EA0" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M37 29C43 29 47 24 49 18C50 24 52 30 55 31C61 29 66 20 69 14C70 25 66 38 59 46C54 52 46 55 39 55" stroke="#884EA0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M16 63C24 70 35 70 45 64" stroke="#884EA0" stroke-width="2" stroke-linecap="round"/>
          <circle cx="43" cy="38" r="1.4" fill="#884EA0"/>
          <text x="80" y="33" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#7c8594">RhinoMDs</text>
          <text x="80" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#7c8594">Billing Services</text>
          <text x="80" y="75" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="11.2" fill="#884EA0">Your Strength In Practice Management</text>
        </svg>
      </div>
      <h1 class="intro-company">RhinoMDs Billing Services</h1>
      <p class="intro-tagline">Your Strength In Practice Management</p>
      <div class="intro-divider"></div>
      <div class="intro-dept">Medical Virtual Assistant Department</div>
      <div class="intro-loader"><i></i></div>
    </div>
  </div>` : ""}

  <div class="login-page">
    <section class="hero-panel">
      <div>
        ${LOGO_HTML}
        <div class="eyebrow-pill">● Medical Virtual Assistant Department</div>
        <h2 class="hero-title">Centralized Medical VA Performance & Sign-Off Hub</h2>
        <p style="margin:0;color:#cbd5e1;font-size:15px">Track daily VOBs, patient outreach, scheduling, collections, team tasks, and bonus scorecards in one secure live portal.</p>
        <div class="bento-grid">
          <div class="glass-card"><small>Daily Tracking</small><strong>Sign-Offs & Audit Logs</strong><span>Full record of updates & Excel/PDF reports</span></div>
          <div class="glass-card"><small>Team Collaboration</small><strong>Tasks & Notifications</strong><span>Task alerts, birthday wishes & leaderboards</span></div>
        </div>
      </div>
      <div style="font-size:12px;color:#cbd5e1;margin-top:24px">© RhinoMDs Billing Services • Admin • Row Leads • Medical VAs</div>
    </section>

    <section class="form-panel">
      <div class="login-card">
        <h2 style="margin:0 0 6px;font-size:23px">Sign in to your account</h2>
        <p style="margin:0 0 16px;color:var(--muted);font-size:13px">Select your role, then enter your assigned username and password.</p>
        <label style="font-size:11px;font-weight:700;color:#475569;display:block;margin-bottom:6px">I am signing in as:</label>
        <div class="role-tabs" id="roleTabs">
          <button type="button" data-r="super_admin" class="${loginRole==="super_admin"?"active":""}">Admin</button>
          <button type="button" data-r="row_lead" class="${loginRole==="row_lead"?"active":""}">Row Lead</button>
          <button type="button" data-r="user" class="${loginRole==="user"?"active":""}">User (VA)</button>
        </div>
        ${errMsg ? `<div class="notice" style="background:#fff0f0;border-color:#f5c2c2;color:var(--red)">${esc(errMsg)}</div>` : ""}
        <form id="loginForm">

function activeVAs(){ return state.users.filter(u => u.status === "Active" && u.role === "user"); }
function assigned(user){ return state.assignments.filter(a => a.user === user).map(a => a.practice); }
function leadOf(user){ return state.users.find(u => u.name === user)?.lead || ""; }
function signStatus(s){ return [s.vobs,s.calls,s.scheduling,s.payments,s.extra].some(v=>num(v)>0)||String(s.notes||"").trim()?"Signed":"Pending"; }
function sum(rows,key){ return rows.reduce((a,r)=>a+num(r[key]),0); }
function monthRows(month){ return state.signoffs.filter(s=>inMonth(s.date,month)); }

function employeeStats(user,month){
  const rows=monthRows(month).filter(s=>s.user===user), u=state.users.find(x=>x.name===user);
  const days=rows.filter(s=>signStatus(s)==="Signed").length, practices=Math.max(1,assigned(user).length);
  const [a,b]=monthBounds(month), daysCount=workdays(a,b), t=state.targets, w=state.weights;
  const actual={vobs:sum(rows,"vobs"),calls:sum(rows,"calls"),scheduling:sum(rows,"scheduling"),payments:sum(rows,"payments"),extra:sum(rows,"extra"),consistency:days};
  const attain={
    vobs:Math.min(1,actual.vobs/Math.max(1,t.vobs*practices*daysCount)),
    calls:Math.min(1,actual.calls/Math.max(1,t.calls*practices*daysCount)),
    scheduling:Math.min(1,actual.scheduling/Math.max(1,t.scheduling*practices*daysCount)),
    payments:Math.min(1,actual.payments/Math.max(1,t.payments*practices*daysCount)),
    extra:Math.min(1,actual.extra/Math.max(1,t.extra*practices*daysCount)),
    consistency:Math.min(1,days/Math.max(1,daysCount))
  };
  const totalW=Object.values(w).reduce((x,y)=>x+num(y),0);
  const score=totalW ? 10*Object.keys(w).reduce((acc,k)=>acc+attain[k]*num(w[k]),0)/totalW : 0;
  return {user,lead:u?.lead||"",practices:assigned(user).length,days,actual,score:Math.round(score*10)/10};
}

function calendarHTML(date){
  const d=new Date(date+"T12:00:00"), y=d.getFullYear(), m=d.getMonth(), first=new Date(y,m,1).getDay(), days=new Date(y,m+1,0).getDate();
  const signed=new Set(state.signoffs.filter(s=>s.date.startsWith(date.slice(0,7))).map(s=>s.date));
  let cells=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="dow">${x}</div>`).join("");
  for(let i=0;i<first;i++) cells+="<div></div>";
  for(let n=1;n<=days;n++){
    const dt=`${y}-${String(m+1).padStart(2,"0")}-${String(n).padStart(2,"0")}`;
    cells+=`<div class="day${dt===selectedDate?" selected":""}${dt===todayISO()?" today":""}${signed.has(dt)?" has-data":""}" data-date="${dt}">${n}</div>`;
  }
  return `<div class="calendar">${cells}</div>`;
}

async function downloadFile(url, filename) {
  try {
    const res = await fetch(url);
    if (!res.ok) { const j = await res.json().catch(()=>({})); throw new Error(j.error || "Download failed"); }
    const blob = await res.blob();
    downloadBlob(filename, blob);
    toast(`Downloaded ${filename}`);
  } catch (err) { toast(err.message); }
}

function exportBackup(){ downloadBlob("rhinomds-va-backup.json", new Blob([JSON.stringify(state,null,2)],{type:"application/json"})); toast("Backup downloaded"); }
function downloadBlob(name,blob){ const a=document.createElement("a"),url=URL.createObjectURL(blob); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); }
function downloadCSV(name,rows,headers){ const csv=[headers,...rows].map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(",")).join("\r\n"); downloadBlob(name,new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"})); }
